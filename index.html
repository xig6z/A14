<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JAS PROFILE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:'Poppins',Arial,sans-serif;
    color:white;

    background:#05050a;

    min-height:100vh;
    overflow-x:hidden;
    overflow-y:auto;
}

body:not(.entered){
    overflow:hidden;
}

#bgLayer{
    position:fixed;
    inset:0;
    z-index:-2;

    background-image:
    linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.8)),
    url("https://oceanslinkupl.rf.gd/uploads/f527c432ccfc190df42d4f6749a61d00.jpg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;

    opacity:0;
    transition:opacity 1s ease;
}

#bgLayer.loaded{
    opacity:1;
}

/* ================= CURSOR TRAIL EFFECT ================= */

.cursor-dot{
    position:fixed;
    width:14px;
    height:14px;

    pointer-events:none;
    z-index:9998;

    color:#fff;

    filter:drop-shadow(0 0 6px rgba(150,100,255,.9));

    animation:cursorFade .55s ease-out forwards;
}

.cursor-dot svg{
    width:100%;
    height:100%;
    fill:currentColor;
}

@keyframes cursorFade{
    0%{
        opacity:1;
        transform:scale(1) rotate(0deg);
    }
    100%{
        opacity:0;
        transform:scale(.2) rotate(90deg) translateY(-6px);
    }
}

.sparkle{
    position:fixed;
    border-radius:50%;
    background:white;
    pointer-events:none;
    z-index:-1;
    box-shadow:0 0 6px 1px rgba(255,255,255,.9);
    animation:twinkle linear infinite;
}

@keyframes twinkle{
    0%,100%{opacity:0;transform:scale(.4);}
    50%{opacity:1;transform:scale(1.2);}
}

/* ================= TAP TO ENTER ================= */

#tap{
    position:fixed;
    inset:0;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    background:rgba(0,0,0,.25);

    z-index:9999;

    cursor:pointer;

    transition:.8s;
}

.tapButton{
    padding:16px 34px;

    border:1px solid rgba(255,255,255,.6);
    border-radius:50px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:14px;
    font-weight:500;
    letter-spacing:3px;

    background:rgba(255,255,255,.05);
    backdrop-filter:blur(6px);

    user-select:none;

    animation:glow 1.8s infinite;
}

@keyframes glow{

    0%,100%{
        transform:scale(1);
        box-shadow:0 0 12px rgba(255,255,255,.4);
    }

    50%{
        transform:scale(1.05);
        box-shadow:0 0 30px rgba(255,255,255,.7);
    }

}

/* Animasi keluar */

#tap.hide{
    opacity:0;
    transform:scale(1.5);
    pointer-events:none;
}


/* ================= MENU ================= */

#menu{
    min-height:100vh;

    padding:20px 0;

    display:flex;
    justify-content:center;
    align-items:center;

    opacity:0;
    transform:scale(.8);

    transition:.8s;

    pointer-events:none;
}

#menu.show{
    opacity:1;
    transform:scale(1);

    pointer-events:auto;
}

.container{
    position:relative;

    width:90%;
    max-width:400px;

    padding:26px 24px;

    text-align:center;

    background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(0,0,0,.35));

    border:1px solid rgba(255,255,255,.18);

    border-radius:28px;

    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);

    box-shadow:0 10px 40px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.15);
}

.profile-wrap{
    position:relative;
    width:78px;
    height:78px;
    margin:0 auto;
}

.profile-wrap::before{
    content:"";
    position:absolute;
    inset:-7px;
    border-radius:50%;

    background:conic-gradient(from 0deg, #ff2e97, #7b2ff7, #00d4ff, #ffe600, #ff2e97);

    filter:blur(5px);

    animation:spinBorder 4s linear infinite;
}

@keyframes spinBorder{
    to{ transform:rotate(360deg); }
}

.profile{
    position:relative;
    width:78px;
    height:78px;

    border-radius:50%;

    object-fit:cover;

    border:3px solid rgba(255,255,255,.9);
    box-shadow:0 0 0 4px rgba(255,255,255,.08), 0 0 25px rgba(255,255,255,.5);
}

.status-dot{
    position:absolute;
    bottom:2px;
    right:2px;

    width:18px;
    height:18px;

    border-radius:50%;

    background:#31d97a;
    border:3px solid #17181d;

    box-shadow:0 0 10px rgba(49,217,122,.8);

    animation:statusPulse 2s infinite;
}

@keyframes statusPulse{
    0%,100%{ box-shadow:0 0 10px rgba(49,217,122,.8); }
    50%{ box-shadow:0 0 18px rgba(49,217,122,1); }
}

h1{
    margin-top:12px;
    font-size:21px;
    font-weight:700;
    letter-spacing:1px;

    background:linear-gradient(90deg, #ffffff, #ffd9f5, #c9b8ff, #ffffff);
    background-size:200% auto;

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;

    animation:shimmer 3s linear infinite;
}

@keyframes shimmer{
    to{ background-position:200% center; }
}

/* ================= BADGES ================= */

.badges{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;

    margin-top:7px;
}

.badge{
    position:relative;

    width:27px;
    height:27px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:default;

    transition:.25s;
}

.badge svg{
    width:14px;
    height:14px;
    fill:white;
}

.badge:hover{
    transform:scale(1.18) translateY(-2px);
}

.badge-verified{
    background:linear-gradient(135deg,#3897f0,#00d2ff);
    box-shadow:0 0 10px rgba(56,151,240,.65);
}

.badge-premium{
    background:linear-gradient(135deg,#ffb800,#ff5f8d);
    box-shadow:0 0 10px rgba(255,150,50,.65);
    animation:badgePulse 2.2s ease-in-out infinite;
}

.badge-og{
    background:linear-gradient(135deg,#7b2ff7,#00d4ff);
    box-shadow:0 0 10px rgba(123,47,247,.6);
}

@keyframes badgePulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.15); }
}

.badge::after{
    content:attr(data-name);
    position:absolute;
    bottom:130%;
    left:50%;
    transform:translateX(-50%) translateY(4px);

    background:rgba(0,0,0,.85);
    color:white;
    font-size:10px;
    font-weight:500;
    white-space:nowrap;
    padding:4px 8px;
    border-radius:6px;

    opacity:0;
    pointer-events:none;

    transition:.2s;
}

.badge:hover::after{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

.bio{
    margin:6px 0 6px;
    color:#cfcfcf;
    font-size:13px;
    font-weight:400;
    letter-spacing:.3px;
}

/* ================= STATS LINE (animated views counter) ================= */

.stats-line{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;

    margin:0 0 20px;

    color:#9d9da3;
    font-size:12px;
    letter-spacing:.3px;
}

.stats-icon{
    width:14px;
    height:14px;
    fill:#9d9da3;
    flex-shrink:0;
}

.stats-line #viewCount{
    color:#e5e5ea;
    font-weight:600;
    font-variant-numeric:tabular-nums;
    min-width:2ch;
    display:inline-block;
}

.credit{
    margin:0 0 12px;
    color:#8a8a8f;
    font-size:10.5px;
    font-weight:400;
    line-height:1.5;
    letter-spacing:.3px;
}

.credit-name{
    color:#d9c9ff;
    font-weight:600;
}

/* ================= LIVE CLOCK CARD ================= */

.clock-card{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;

    padding:10px 16px;
    margin:0 0 12px;

    border-radius:14px;

    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.14);
}

.analog-clock{
    width:56px;
    height:56px;
    flex-shrink:0;
}

.analog-clock .clock-face{
    fill:rgba(255,255,255,.05);
    stroke:rgba(255,255,255,.5);
    stroke-width:2.5;
}

.analog-clock .tick{
    stroke:rgba(255,255,255,.35);
    stroke-width:2;
}

.analog-clock .hand{
    stroke-linecap:round;
}

.analog-clock .hour-hand{
    stroke:#fff;
    stroke-width:5;
}

.analog-clock .min-hand{
    stroke:#fff;
    stroke-width:3.5;
}

.analog-clock .sec-hand{
    stroke:#b487ff;
    stroke-width:2;
}

.analog-clock .clock-center{
    fill:#b487ff;
}

.clock-info{
    text-align:left;
}

.clock-time{
    font-size:15px;
    font-weight:600;
    color:#fff;
    letter-spacing:.6px;
}

.clock-date{
    margin-top:1px;
    font-size:10.5px;
    color:#9d9da3;
    letter-spacing:.3px;
}

.clock-tz{
    margin-top:1px;
    font-size:10px;
    color:#7a7a80;
    letter-spacing:.3px;
}

.social{
    position:relative;
    overflow:hidden;

    display:flex;
    align-items:center;
    gap:14px;

    width:100%;

    padding:11px 16px;

    margin:7px 0;

    border-radius:16px;

    text-decoration:none;

    color:white;

    background:rgba(255,255,255,.07);

    border:1px solid rgba(255,255,255,.15);

    font-weight:600;
    font-size:15px;
    letter-spacing:.3px;

    transition:.25s ease;
}

.social::after{
    content:"";
    position:absolute;
    top:0;
    left:-150%;
    width:55%;
    height:100%;

    background:linear-gradient(120deg, transparent, rgba(255,255,255,.4), transparent);
    transform:skewX(-20deg);

    transition:left .6s ease;
}

.social:hover::after{
    left:150%;
}

.icon-wrap{
    width:38px;
    height:38px;
    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:rgba(255,255,255,.1);
}

.social .label{
    flex:1;
    text-align:left;
}

.social svg{
    width:19px;
    height:19px;
    fill:currentColor;
}

.social:hover{
    transform:translateY(-2px);
    background:rgba(255,255,255,.15);
    border-color:rgba(255,255,255,.35);
}

.social:active{
    transform:scale(.96);
}

.discord:hover{
    box-shadow:0 6px 20px rgba(88,101,242,.45);
}

.discord:hover .icon-wrap{
    background:#5865F2;
}

.tiktok:hover{
    box-shadow:0 6px 20px rgba(255,0,80,.4);
}

.tiktok:hover .icon-wrap{
    background:#ff0050;
}

.youtube:hover{
    box-shadow:0 6px 20px rgba(255,0,0,.4);
}

.youtube:hover .icon-wrap{
    background:#ff0000;
}

.links-label{
    display:flex;
    align-items:center;
    gap:10px;

    margin:4px 0 10px;

    color:#8a8a8f;
    font-size:11px;
    font-weight:600;
    letter-spacing:1.5px;
    text-transform:uppercase;
}

/* ================= TECH / INTERESTS ================= */

.tech-row{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:6px;

    margin:0 0 12px;
}

.tech-pill{
    display:flex;
    align-items:center;
    gap:5px;

    padding:5px 10px 5px 6px;

    border-radius:20px;

    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.14);

    font-size:11px;
    font-weight:500;
    color:#dcdce0;

    transition:.2s;
}

.tech-pill:hover{
    background:rgba(255,255,255,.12);
    transform:translateY(-1px);
}

.tech-icon{
    width:16px;
    height:16px;
    border-radius:5px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:9px;
    font-weight:800;
    color:#fff;

    flex-shrink:0;
}

.links-label::before,
.links-label::after{
    content:"";
    flex:1;
    height:1px;
    background:rgba(255,255,255,.15);
}

.social .arrow{
    margin-right:auto;
}

.social .chevron{
    width:16px;
    height:16px;
    opacity:.4;
    transition:.25s;
}

.social:hover .chevron{
    opacity:.9;
    transform:translateX(3px);
}

.divider{
    height:1px;
    margin:14px 0 10px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.2), transparent);
}

/* ================= PROJECTS ================= */

.project-card{
    position:relative;
    overflow:hidden;

    text-align:left;

    padding:12px 14px;
    margin:0 0 8px;

    border-radius:16px;

    background:linear-gradient(160deg, rgba(255,255,255,.06), rgba(0,0,0,.3));
    border:1px solid rgba(255,255,255,.14);
}

.project-tags{
    display:flex;
    flex-wrap:wrap;
    gap:6px;

    margin-bottom:8px;
}

.project-tag{
    display:flex;
    align-items:center;
    gap:5px;

    padding:4px 9px 4px 6px;

    border-radius:20px;

    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.14);

    font-size:10.5px;
    font-weight:600;
    color:#dcdce0;
}

.project-tag .tech-icon{
    width:14px;
    height:14px;
    font-size:8px;
}

.project-title{
    font-size:16px;
    font-weight:700;
    color:#fff;
    letter-spacing:.3px;
}

.project-desc{
    margin-top:5px;
    font-size:12.5px;
    color:#a9a9b0;
    line-height:1.55;
}

footer{
    color:#888;
    font-size:11.5px;
    letter-spacing:.6px;
}

/* ================= MUSIC PLAYER ================= */

#musicBtn{
    position:fixed;
    bottom:20px;
    right:20px;

    width:52px;
    height:52px;

    border-radius:50%;

    background:linear-gradient(180deg, rgba(255,255,255,.15), rgba(0,0,0,.5));
    border:1px solid rgba(255,255,255,.25);
    backdrop-filter:blur(10px);

    display:flex;
    justify-content:center;
    align-items:center;

    cursor:pointer;
    z-index:500;

    box-shadow:0 6px 20px rgba(0,0,0,.5);

    transition:.3s;
}

#musicBtn:hover{
    background:linear-gradient(180deg, rgba(255,255,255,.25), rgba(0,0,0,.6));
    transform:scale(1.08);
}

.eq{
    display:flex;
    align-items:flex-end;
    gap:3px;
    height:20px;
}

.eq span{
    width:3px;
    background:white;
    border-radius:2px;
    height:6px;
    animation:eqBounce 0.9s infinite ease-in-out;
}

.eq span:nth-child(1){animation-delay:0s;}
.eq span:nth-child(2){animation-delay:.2s;}
.eq span:nth-child(3){animation-delay:.4s;}
.eq span:nth-child(4){animation-delay:.1s;}

@keyframes eqBounce{
    0%,100%{height:6px;}
    50%{height:20px;}
}

.eq.paused span{
    animation-play-state:paused;
    height:6px;
}

#musicPanel{
    position:fixed;
    bottom:82px;
    right:20px;

    background:linear-gradient(180deg, rgba(255,255,255,.1), rgba(0,0,0,.55));
    border:1px solid rgba(255,255,255,.25);
    backdrop-filter:blur(12px);

    border-radius:16px;
    padding:14px 16px;

    display:flex;
    flex-direction:column;
    gap:9px;

    width:165px;

    opacity:0;
    transform:translateY(10px);
    pointer-events:none;

    box-shadow:0 8px 25px rgba(0,0,0,.5);

    transition:.3s;

    z-index:500;
}

#musicPanel.show{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
}

#musicPanel .trackName{
    font-size:12px;
    color:#ddd;
    text-align:center;
}

#playPauseBtn{
    width:34px;
    height:34px;
    margin:2px auto 0;

    border:none;
    border-radius:50%;

    background:rgba(255,255,255,.15);
    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    transition:.2s;
}

#playPauseBtn:hover{
    background:rgba(255,255,255,.3);
}

#playPauseBtn svg{
    width:15px;
    height:15px;
    fill:white;
}

#progressBar{
    width:100%;
    height:4px;
    background:rgba(255,255,255,.2);
    border-radius:5px;
    overflow:hidden;
}

#progressFill{
    height:100%;
    width:0%;
    background:white;
    transition:width .2s linear;
}

#volumeSlider{
    width:100%;
    accent-color:white;
}

/* ================= FACE GLITCH SECTION (below bio, bottom of page) ================= */

#faceSection{
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:40px 0;

    opacity:0;
    transform:scale(.9);

    transition:1s;

    pointer-events:none;
}

#faceSection.show{
    opacity:1;
    transform:scale(1);

    pointer-events:auto;
}

.face-card{
    width:90%;
    max-width:400px;

    padding:48px 24px;

    text-align:center;

    background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(0,0,0,.35));

    border:1px solid rgba(255,255,255,.18);

    border-radius:28px;

    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);

    box-shadow:0 10px 40px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.15);
}

.face-eyes{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:52px;

    margin-bottom:16px;
}

.face-eye{
    font-size:46px;
    font-weight:700;
    line-height:1;

    min-width:44px;

    color:#fff;

    text-shadow:0 0 18px rgba(180,135,255,.6);

    display:inline-block;
    transition:opacity .18s ease, transform .18s ease;
}

.face-mouth{
    font-size:26px;
    font-weight:700;
    line-height:1;

    color:#fff;

    text-shadow:0 0 14px rgba(180,135,255,.5);

    display:inline-block;
    transition:opacity .18s ease, transform .18s ease;
}

</style>
</head>

<body>

<div id="bgLayer"></div>

<!-- ================= AUDIO (REPLACE SRC WITH YOUR MUSIC LINK) ================= -->

<audio id="bgMusic" src="https://raw.githubusercontent.com/xig6z/A2/main/fly%28MP3_160K%29.mp3" loop preload="auto"></audio>


<!-- ================= MUSIC BUTTON ================= -->

<div id="musicBtn">
    <div class="eq paused" id="eqBars">
        <span></span><span></span><span></span><span></span>
    </div>
</div>

<div id="musicPanel">
    <div class="trackName">Background Music</div>
    <div id="progressBar"><div id="progressFill"></div></div>
    <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.4">
    <button id="playPauseBtn" type="button">
        <svg id="ppIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
</div>


<!-- ================= TAP TO ENTER ================= -->

<div id="tap">

    <div class="tapButton">
        [ Click ]
    </div>

</div>


<!-- ================= MENU JAS ================= -->

<div id="menu">

    <div class="container">

        <div class="profile-wrap">
        <img
            class="profile"
            src="https://i.ibb.co.com/LhH6Gtr7/IMG-20260825-WA0037.jpg"
            alt="JAS"
        >
        <span class="status-dot"></span>
        </div>

        <h1>JAS</h1>

        <div class="badges">

            <span class="badge badge-verified" data-name="Verified">
                <svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
            </span>

            <span class="badge badge-premium" data-name="Premium">
                <svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.26L22 9.27l-5 4.87 1.18 6.86L12 17.77l-6.18 3.23L7 14.14 2 9.27l7.1-1.01z"/></svg>
            </span>

            <span class="badge badge-og" data-name="OG Member">
                <svg viewBox="0 0 24 24"><path d="M13 2L3 14h7l-1 8 11-13h-7z"/></svg>
            </span>

        </div>

        <p class="bio">
            SORRY
        </p>

        <div class="clock-card">

            <svg class="analog-clock" viewBox="0 0 100 100">
                <circle class="clock-face" cx="50" cy="50" r="46"/>

                <line class="tick" x1="50" y1="8" x2="50" y2="14"/>
                <line class="tick" x1="50" y1="86" x2="50" y2="92"/>
                <line class="tick" x1="8" y1="50" x2="14" y2="50"/>

            <span class="face-eye" id="eyeR">•</span>
        </div>

        <div class="face-mouth" id="mouth">_</div>

    </div>

</div>


<script>

var tap = document.getElementById("tap");
var menu = document.getElementById("menu");

/* ===== BACKGROUND FADE-IN (prevents transparency flash on first load) ===== */

var bgLayer = document.getElementById("bgLayer");
var bgImg = new Image();

bgImg.onload = function(){
    bgLayer.classList.add("loaded");
};

bgImg.src = "https://oceanslinkupl.rf.gd/uploads/f527c432ccfc190df42d4f6749a61d00.jpg";

/* If the image is already cached, it's ready right away */

if(bgImg.complete){
    bgLayer.classList.add("loaded");
}


/* ===== CURSOR TRAIL EFFECT (stars, speed-based) ===== */

var STAR_SVG = '<svg viewBox="0 0 24 24"><path d="M12 0l2.6 8.4L23 11l-8.4 2.6L12 22l-2.6-8.4L1 11l8.4-2.6z"/></svg>';

var lastTrailTime = 0;
var lastX = null;
var lastY = null;

function spawnTrail(x, y){

    var now = Date.now();

    /* Throttle scales with how fast the pointer is moving: fast = more stars */

    var dist = (lastX === null) ? 0 : Math.hypot(x - lastX, y - lastY);
    var speed = Math.min(dist, 80);
    var throttle = 25 - (speed / 80) * 15; /* ~10ms when fast, ~25ms when slow */

    lastX = x;
    lastY = y;

    if(now - lastTrailTime < throttle) return;

    lastTrailTime = now;

    var star = document.createElement("div");
    star.className = "cursor-dot";
    star.innerHTML = STAR_SVG;

    var size = 8 + Math.min(speed / 6, 10);

    star.style.width = size + "px";
    star.style.height = size + "px";
    star.style.left = (x - size / 2) + "px";
    star.style.top = (y - size / 2) + "px";

    var hueShift = Math.random() > 0.5 ? "#b487ff" : "#7ee8ff";
    star.style.color = hueShift;

    document.body.appendChild(star);

    setTimeout(function(){
        star.remove();
    }, 550);

}

document.addEventListener("mousemove", function(e){
    spawnTrail(e.clientX, e.clientY);
});

document.addEventListener("touchmove", function(e){

    var t = e.touches[0];

    if(t) spawnTrail(t.clientX, t.clientY);

}, {passive:true});


/* ===== LIVE CLOCK (analog + digital) ===== */

var liveTimeEl = document.getElementById("liveTime");
var liveDateEl = document.getElementById("liveDate");
var liveTzEl = document.getElementById("liveTz");

var hourHand = document.getElementById("hourHand");
var minHand = document.getElementById("minHand");
var secHand = document.getElementById("secHand");

var WEEKDAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function updateClock(){

    var now = new Date();
    var h = now.getHours();
    var m = now.getMinutes();
    var s = now.getSeconds();

    /* Digital time */

    liveTimeEl.textContent =
        String(h).padStart(2, "0") + ":" +
        String(m).padStart(2, "0") + ":" +
        String(s).padStart(2, "0");

    /* Date */

    liveDateEl.textContent =
        WEEKDAYS[now.getDay()] + ", " + MONTHS[now.getMonth()] + " " + now.getDate();

    /* Timezone offset */

    var offsetMin = -now.getTimezoneOffset();
    var sign = offsetMin >= 0 ? "+" : "-";
    var offsetH = Math.abs(offsetMin / 60);

    liveTzEl.textContent = "GMT" + sign + offsetH;

    /* Analog hands */

    var secDeg = s * 6;
    var minDeg = m * 6 + s * 0.1;
    var hourDeg = (h % 12) * 30 + m * 0.5;

    secHand.setAttribute("transform", "rotate(" + secDeg + " 50 50)");
    minHand.setAttribute("transform", "rotate(" + minDeg + " 50 50)");
    hourHand.setAttribute("transform", "rotate(" + hourDeg + " 50 50)");

}

updateClock();
setInterval(updateClock, 1000);


/* ===== SPARKLES (twinkling glitter in the background) ===== */

for(var i = 0; i < 25; i++){

    var sp = document.createElement("div");
    sp.className = "sparkle";

    var size = Math.random() * 3 + 1.5;

    sp.style.width = size + "px";
    sp.style.height = size + "px";
    sp.style.top = Math.random() * 100 + "vh";
    sp.style.left = Math.random() * 100 + "vw";
    sp.style.animationDuration = (2 + Math.random() * 3) + "s";
    sp.style.animationDelay = (Math.random() * 4) + "s";

    document.body.appendChild(sp);

}


/* ===== FACE GLITCH ANIMATION (idle face that randomly scrambles, then settles) ===== */

var eyeL = document.getElementById("eyeL");
var eyeR = document.getElementById("eyeR");
var mouth = document.getElementById("mouth");

var EYE_SYMBOLS = ["•","+","=","*","†","-","$","×","✦","0","^","o","O","#","%","~","¤","◆","■","▲"];
var MOUTH_SYMBOLS = ["_","=","0","•","-","$",".","~","o","O","w","3","∆","¬"];

var REST_EYE = "•";
var REST_MOUTH = "_";

function randomFrom(arr){
    return arr[Math.floor(Math.random() * arr.length)];
}

function swapSymbol(el, symbol){

    /* Fade out, change the character, fade back in — avoids jarring jumps */

    el.style.opacity = 0;
    el.style.transform = "translateY(-3px)";

    setTimeout(function(){

        el.textContent = symbol;
        el.style.opacity = 1;
        el.style.transform = "translateY(0)";

    }, 90);

}

function faceGlitchBurst(){

    if(!eyeL || !eyeR || !mouth) return;

    var eyeSymbol = randomFrom(EYE_SYMBOLS);

    swapSymbol(eyeL, eyeSymbol);
    swapSymbol(eyeR, eyeSymbol);
    swapSymbol(mouth, randomFrom(MOUTH_SYMBOLS));

}

function faceLoop(){

    faceGlitchBurst();
    setTimeout(faceLoop, 260);

}

if(eyeL && eyeR && mouth){

    eyeL.textContent = REST_EYE;
    eyeR.textContent = REST_EYE;
    mouth.textContent = REST_MOUTH;

    setTimeout(faceLoop, 260);

}


/* ===== MUSIC ELEMENTS ===== */

var bgMusic = document.getElementById("bgMusic");
var musicBtn = document.getElementById("musicBtn");
var musicPanel = document.getElementById("musicPanel");
var eqBars = document.getElementById("eqBars");
var progressFill = document.getElementById("progressFill");
var volumeSlider = document.getElementById("volumeSlider");
var playPauseBtn = document.getElementById("playPauseBtn");
var ppIcon = document.getElementById("ppIcon");

var ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
var ICON_PAUSE = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';

bgMusic.volume = 0;

bgMusic.addEventListener("error", function(){
    console.error("bgMusic failed to load. Current src:", bgMusic.currentSrc || bgMusic.src);
});

function fadeInVolume(){

    var target = parseFloat(volumeSlider.value);
    var current = 0;

    var fade = setInterval(function(){

        current += target / 10;

        if(current >= target){
            current = target;
            clearInterval(fade);
        }

        bgMusic.volume = current;

    }, 30);

}

function startMusic(){

    if(!bgMusic.paused) return;

    bgMusic.volume = parseFloat(volumeSlider.value);

    var playPromise = bgMusic.play();

    if(playPromise !== undefined){

        playPromise.catch(function(){

            /* Browser blocked autoplay, retry on first interaction */

            document.addEventListener("click", function retry(){

                bgMusic.play();
                document.removeEventListener("click", retry);

            }, {once:true});

        });

    }

}

function enterSite(){

    tap.classList.add("hide");
    document.body.classList.add("entered");

    setTimeout(function(){

        menu.classList.add("show");

        var faceSection = document.getElementById("faceSection");
        if(faceSection) faceSection.classList.add("show");

    },400);

    /* Trigger autoplay within the same click/tap event */

    startMusic();

}


/* For mobile */
/* Using touchend (not touchstart) — most mobile browsers only treat
   touchend/click as a valid gesture for unlocking audio autoplay,
   so playing on touchstart caused the first attempt to be blocked. */

tap.addEventListener("touchend", function(e){

    e.preventDefault();

    enterSite();

}, {passive:false});


/* For click */

tap.addEventListener("click", enterSite);


/* ===== FLOATING MUSIC BUTTON: only opens/closes the panel, doesn't stop the sound ===== */

musicBtn.addEventListener("click", function(e){

    e.stopPropagation();

    musicPanel.classList.toggle("show");

});


/* ===== Independent Play/Pause button inside the panel ===== */

playPauseBtn.addEventListener("click", function(e){

    e.stopPropagation();

    if(bgMusic.paused){
        startMusic();
    } else {
        bgMusic.pause();
    }

});


/* ===== Close the panel by clicking anywhere outside it ===== */

document.addEventListener("click", function(e){

    if(!musicPanel.classList.contains("show")) return;

    if(musicPanel.contains(e.target) || musicBtn.contains(e.target)) return;

    musicPanel.classList.remove("show");

});


/* Prevent the panel from closing when clicking inside it (slider, etc.) */

musicPanel.addEventListener("click", function(e){
    e.stopPropagation();
});


/* ===== SYNC UI DENGAN STATUS AUDIO ===== */

bgMusic.addEventListener("play", function(){
    eqBars.classList.remove("paused");
    ppIcon.innerHTML = ICON_PAUSE;
});

bgMusic.addEventListener("pause", function(){
    eqBars.classList.add("paused");
    ppIcon.innerHTML = ICON_PLAY;
});

bgMusic.addEventListener("timeupdate", function(){

    if(bgMusic.duration){

        var percent = (bgMusic.currentTime / bgMusic.duration) * 100;
        progressFill.style.width = percent + "%";

    }

});


/* ===== VOLUME SLIDER (never stops the sound) ===== */

volumeSlider.addEventListener("input", function(){
    bgMusic.volume = volumeSlider.value;
});

</script>
